# 사이트 기본 설정
# 문서: https://mmistakes.github.io/minimal-mistakes/docs/configuration/
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default" # "air", "dark", "dirt", "neon", "mint", "sunrise" 등으로 변경 가능

locale: "ko-KR"
title: "퀀트 노트"
subtitle: "데이터로 읽는 투자"
name: "퀀트 노트"
description: "퀀트 투자, 백테스트, 파이썬 데이터 분석을 기록하는 블로그입니다."
url: "https://quant-note.com"
repository: "yeonghwi-yoo/yeonghwi-yoo.github.io"
timezone: Asia/Seoul

# 검색
search: true

# 글 주소 형식
permalink: /posts/:title/
paginate: 5
paginate_path: /page:num/

# GitHub Pages에서 지원하는 플러그인만 사용
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

include:
  - _pages

# 사이트에 노출하지 않을 파일
exclude:
  - CONTENT_PLAN.md
  - README.md
  - Gemfile
  - scripts

# 작성자 프로필 (사이드바에 표시)
author:
  name: "퀀트 노트"
  bio: "퀀트 투자와 데이터 분석을 공부하며 기록하는 익명 블로그입니다."
  location: "Seoul, Korea"

# 하단 푸터 링크 (익명 운영을 위해 외부 계정 링크는 두지 않음)
footer:
  links: []

# 문서 유형별 기본값
defaults:
  # 블로그 글(_posts)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      show_date: true
      toc: true
      toc_sticky: true
  # 일반 페이지(_pages)
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
