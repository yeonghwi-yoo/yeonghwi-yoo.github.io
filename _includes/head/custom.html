<!-- ===================================================================
  사이트 <head>에 삽입되는 커스텀 코드 자리입니다.

  [1] Google 애드센스 — 모든 페이지 <head>에 삽입됩니다.
      계정: ca-pub-7635369920244942  (루트의 ads.txt 와 동일한 게시자 ID)
==================================================================== -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7635369920244942" crossorigin="anonymous"></script>

<!-- ===================================================================
  [2] 페이지네이션 목록 페이지(/page2/, /page3/ ...)는 본문이 얇으므로
      검색 색인에서 제외합니다. 링크는 따라가도록(follow) 둡니다.
      첫 페이지(/)는 제외하지 않습니다.
==================================================================== -->
{% if paginator %}{% if paginator.page > 1 %}
<meta name="robots" content="noindex,follow">
{% endif %}{% endif %}

<!-- ===================================================================
  [3] Google 서치콘솔 소유권 확인
==================================================================== -->
<meta name="google-site-verification" content="iLllxUSgTxx6fv_iSD3JqLCDiAV1H7rxwFDQcQW7axI" />
