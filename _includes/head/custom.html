<!-- ===================================================================
  사이트 <head>에 삽입되는 커스텀 코드 자리입니다.

  [1] Google 애드센스 — 모든 페이지 <head>에 삽입됩니다.
      계정: ca-pub-7635369920244942  (루트의 ads.txt 와 동일한 게시자 ID)
==================================================================== -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7635369920244942" crossorigin="anonymous"></script>

<!-- ===================================================================
  [2] Google Analytics 4 — 측정 ID: G-7S0DRESZPK
      테마의 analytics 설정은 태그를 </body> 직전에 넣지만,
      구글 권장 위치가 <head> 라서 여기에 직접 넣는다.
==================================================================== -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7S0DRESZPK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-7S0DRESZPK');
</script>

<!-- ===================================================================
  [3] 페이지네이션 목록 페이지(/page2/, /page3/ ...)는 본문이 얇으므로
      검색 색인에서 제외합니다. 링크는 따라가도록(follow) 둡니다.
      첫 페이지(/)는 제외하지 않습니다.
==================================================================== -->
{% if paginator %}{% if paginator.page > 1 %}
<meta name="robots" content="noindex,follow">
{% endif %}{% endif %}
